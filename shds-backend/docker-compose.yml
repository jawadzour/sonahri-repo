services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-shds_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shds_password}
      POSTGRES_DB: ${DB_NAME:-shds_db}
    ports:
      - "5432:5432"
    volumes:
      - shds_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shds_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  shds_pg_data:
