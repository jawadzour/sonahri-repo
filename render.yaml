# Render Blueprint for the full SHDS stack: the main website, the Flask
# API backend, and the standalone admin panel.
#
# Databases are NOT hosted on Render (its free Postgres auto-deletes
# after 30 days). Both DATABASE_URLs below are `sync: false` - paste in
# connection strings from two free Neon projects during Blueprint setup.
# See DEPLOY_RENDER.md for the exact steps.
#
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo.
# Render will prompt for every `sync: false` value below during initial
# creation (secrets are deliberately not stored in this file).

services:
  # --- Main website (React + Express/tRPC) ---
  - type: web
    name: shds-website
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: pnpm install --prod=false && pnpm build
    startCommand: pnpm start
    preDeployCommand: pnpm exec drizzle-kit migrate
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VITE_SHDS_API_URL
        value: https://shds-backend.onrender.com/api/v1/public
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false

  # --- Flask API backend ---
  - type: web
    name: shds-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: shds-backend/Dockerfile
    dockerContext: shds-backend
    preDeployCommand: flask db upgrade
    autoDeploy: true
    healthCheckPath: /api/v1/health/
    envVars:
      - key: APP_CONFIG
        value: production
      - key: FLASK_APP
        value: wsgi.py
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://shds-website.onrender.com,https://shds-admin.onrender.com
      - key: BACKEND_BASE_URL
        value: https://shds-backend.onrender.com
      - key: ADMIN_FRONTEND_URL
        value: https://shds-admin.onrender.com
      - key: UPLOAD_FOLDER
        value: uploads
      - key: GUNICORN_WORKERS
        value: "2"
      - key: MAIL_ENABLED
        value: "true"
      - key: BREVO_SENDER_EMAIL
        value: jawadzour786@gmail.com
      - key: BREVO_SENDER_NAME
        value: SHDS
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false

  # --- Standalone admin panel (static React SPA) ---
  - type: web
    name: shds-admin
    runtime: static
    branch: main
    buildCommand: cd shds-admin && npm install && npm run build
    staticPublishPath: shds-admin/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://shds-backend.onrender.com/api/v1
